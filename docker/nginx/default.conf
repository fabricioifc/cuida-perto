# ==============================================================================
# Configuração do Proxy Reverso NGINX — CuidaPerto
# ==============================================================================

upstream cuidaperto_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Limite máximo de corpo de requisição para prevenir DoS por payload imenso
    client_max_body_size 5M;

    # Cabeçalhos de Segurança HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Rota de monitoramento / Healthcheck
    location /health {
        proxy_pass http://cuidaperto_app/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Proxy para todas as requisições da aplicação Node.js
    location / {
        proxy_pass http://cuidaperto_app;
        proxy_http_version 1.1;

        # Repasse de cabeçalhos de cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts de proxy
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
